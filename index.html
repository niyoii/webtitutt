<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Gift For You 💝</title>
    <style>
        /* --- RESET STYLE BROWSER --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffe3e3;
        }

        /* --- BACKGROUND IMAGE RESPONSIVE --- */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Menjamin gambar tidak memblokir klik mouse/sentuhan */
        }

        .bg-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Menyesuaikan gambar secara otomatis di HP & Laptop tanpa merusaknya */
            object-position: center;
        }

        /* --- CONTAINER UTAMA KEYPAD (RESPONSIF) --- */
        .container {
            position: relative;
            z-index: 999; /* Lapisan paling depan agar tombol bebas diklik */
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(255, 180, 190, 0.25);
            text-align: center;
            width: 90%;
            max-width: 320px; /* Ukuran maksimal di laptop, mengecil otomatis di HP */
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .header-text h2 {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 1.35rem;
            color: #b46a7a;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Indikator Titik Sandi */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 25px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #e2cbcc;
            transition: background 0.2s, transform 0.2s;
        }

        .dot.active {
            background-color: #b46a7a;
            transform: scale(1.15);
        }

        /* Kisi Tombol Angka */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        /* Desain Tombol Interaktif */
        .btn {
            background: rgba(255, 230, 233, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 16px 0;
            font-size: 1.4rem;
            font-weight: 600;
            color: #7d525a;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Menghilangkan efek kedip biru saat ditap di HP */
        }

        .btn:hover {
            background: rgba(255, 215, 222, 1);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Tombol Aksi Spesial (0 dan Hapus) */
        .btn-action {
            background: rgba(230, 242, 255, 0.9);
            color: #526b7d;
        }
        .btn-action:hover {
            background: rgba(204, 229, 255, 1);
        }

        /* --- TRANSISI POP-UP HADIAH --- */
        .gift-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 240, 242, 0.98);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .gift-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .gift-content {
            text-align: center;
            max-width: 85%;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .gift-content h1 {
            color: #b46a7a;
            margin-bottom: 15px;
            font-family: 'Georgia', serif;
        }

        .gift-content p {
            color: #6b7280;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .gift-emoji {
            font-size: 5rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Gambar Latar Belakang Utama -->
    <!-- Catatan: Simpan file gambar desain hangat kamu di dalam folder yang sama dengan nama 'background.png' -->
    <div class="bg-container">
        <img src="bg_lily_softblue.jpg" alt="Warm Pink Blue Theme Background">
    </div>

    <!-- Kotak Keypad Utama -->
    <div class="container">
        <div class="header-text">
            <h2>From ia<br>for all</h2>
        </div>

        <!-- Indikator Masukan Kode -->
        <div class="dots-container">
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
            <div class="dot" id="dot4"></div>
        </div>

        <!-- Grid Tombol Angka Lengkap -->
        <div class="keypad-grid">
            <button class="btn" type="button" onclick="pressKey('1')">1</button>
            <button class="btn" type="button" onclick="pressKey('2')">2</button>
            <button class="btn" type="button" onclick="pressKey('3')">3</button>
            
            <button class="btn" type="button" onclick="pressKey('4')">4</button>
            <button class="btn" type="button" onclick="pressKey('5')">5</button>
            <button class="btn" type="button" onclick="pressKey('6')">6</button>
            
            <button class="btn" type="button" onclick="pressKey('7')">7</button>
            <button class="btn" type="button" onclick="pressKey('8')">8</button>
            <button class="btn" type="button" onclick="pressKey('9')">9</button>
            
            <button class="btn" type="button" onclick="pressKey('0')">0</button>
            <div style="visibility: hidden;"></div> <!-- Penyeimbang Struktur Letak Tombol -->
            <button class="btn" type="button" onclick="clearKey()">⌫</button>
        </div>
    </div>

    <!-- Tampilan Hadiah Setelah Kode Benar -->
    <div class="gift-overlay" id="giftOverlay">
        <div class="gift-content">
            <div class="gift-emoji">🦈🌸🪷💗</div>
            <h1>Surprise! 🎁</h1>
            <p>Wah, kodenya benar! Halaman hadiah spesialmu sudah terbuka! ✨</p>
        </div>
    </div>

    <script>
        // PIN AKSES WEBSITE: Ubah angka '1234' di bawah ini dengan PIN pilihanmu
        const TARGET_PIN = "0108"; 
        let currentInput = "";

        function pressKey(num) {
            if (currentInput.length < 4) {
                currentInput += num;
                updateDots();
                
                if (currentInput.length === 4) {
                    setTimeout(checkPin, 200);
                }
            }
        }

        function clearKey() {
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                updateDots();
            }
        }

        function updateDots() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i <= currentInput.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            }
        }

        function checkPin() {
           if (currentInput === TARGET_PIN) {
        // Ini perintah agar halaman langsung pindah ke halaman kedua
        window.location.href = "halaman.kedua.html"; 
            } else {
                alert("Kodenya salah, coba lagi! 🤫");
                currentInput = "";
                updateDots();
            }
        }
    </script>
</body>
</html>
